name: CI

# The same graph an agent runs locally with `pnpm check`, plus the assertions that prove every gate
# still fires.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A superseded pull request run is waste, but every commit on `main` keeps its own run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Keep this id stable: it is the string a required status check is configured against.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # `fetch-depth: 0` so the changeset check below has the pull request's base commit to diff
      # against; a shallow clone has neither it nor the merge base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No `version:` on purpose: the action reads `packageManager` from package.json. It has to
      # precede setup-node, which shells out to `pnpm store path` to find the directory it caches.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Restore the turbo cache
        uses: actions/cache@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm check

      # `!cancelled()` on every assertion: a pull request that fails the graph above is exactly the
      # one most likely to have weakened a gate, so the assertions still have to report.
      - name: Assert every lint fixture still fires
        if: ${{ !cancelled() }}
        run: pnpm lint:fixtures

      # Both harness paths: the hook still blocks a bad file, the CLI agrees with it,
      # and every harness still points at the same procedure files.
      - name: Assert the agent harness is armed
        if: ${{ !cancelled() }}
        run: pnpm check:agents

      - name: Assert uncovered code still fails the gated packages
        if: ${{ !cancelled() }}
        run: pnpm test:coverage-gate

      - name: Assert the changeset check still fails a source change without one
        if: ${{ !cancelled() }}
        run: pnpm test:changeset-gate

      - name: Assert the bundle budget still fails an oversized chunk
        if: ${{ !cancelled() }}
        run: pnpm test:bundle-budget-gate

      # Pull requests only: a push to `main` has no base to diff against. The "Version Packages"
      # pull request is exempt — it consumes changesets rather than adding one.
      - name: Require a changeset for a source change
        if: >-
          ${{ !cancelled() && github.event_name == 'pull_request'
          && github.head_ref != 'changeset-release/main' }}
        run: pnpm lint:changeset ${{ github.event.pull_request.base.sha }}

      # CI is the only gate nobody can bypass: `--no-verify` and edits made in the GitHub web UI
      # both skip husky, and no ESLint rule reports on formatting.
      - name: Check formatting
        if: ${{ !cancelled() }}
        run: pnpm format:check

  # The web app's end-to-end suite in headless Chromium (PRD §9). It needs neither the API server
  # nor the `claude` CLI: every test answers `/api` itself, and the dev server's proxy errors for
  # anything left unanswered are only logged.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # Same shape as the check job: pnpm before setup-node, which caches the pnpm store.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The browser build belongs to the Playwright version, so that version keys its cache.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @nautink/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium and its system libraries
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter @nautink/web exec playwright install --with-deps chromium

      # The cache holds the browser only; the system libraries it needs are installed every run.
      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter @nautink/web exec playwright install-deps chromium

      # `CI` is set by GitHub: Playwright then retries once, runs 2 workers, records a trace on the
      # retry and writes the HTML report (apps/web/playwright.config.ts).
      - name: Run the end-to-end suite
        run: pnpm --filter @nautink/web test:e2e

      - name: Upload the report and traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 14
